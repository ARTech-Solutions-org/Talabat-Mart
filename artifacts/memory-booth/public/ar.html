<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AI Memory — AR Experience</title>

  <!--
    MindAR.js + Three.js bundle (image tracking, zero-install WebAR)
    Physical target: 102 × 152 mm printed photo card
    Anchor system   : target width = 1 unit  →  height = 152/102 ≈ 1.49 units
  -->
  <!-- MindAR self-hosted bundle (with CDN fallback) -->
  <script src="/mindar-image-three.prod.js"></script>
  <script>
    if (!window.MINDAR || !window.MINDAR.IMAGE) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"><\/script>');
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* MindAR injects its video + canvas here */
    #ar-root {
      width: 100vw; height: 100vh;
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }

    #ar-root video {
      z-index: 0 !important;
    }

    #ar-root canvas {
      z-index: 1 !important;
      pointer-events: none;
    }

    /* ── Scan-guide overlay (visible until target found) ───────────────── */
    #scan-overlay {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(to bottom, rgba(0,0,0,.35) 0%, transparent 40%, transparent 60%, rgba(0,0,0,.55) 100%);
      pointer-events: none;
      transition: opacity .4s;
    }
    #scan-overlay.hidden { opacity: 0; }

    /* Viewfinder — matches 152:102 landscape card aspect */
    .viewfinder {
      width: min(85vw, 320px);
      aspect-ratio: 152 / 102;
      position: relative;
      margin-bottom: 24px;
    }
    .vf-border {
      position: absolute; inset: 0;
      border: 1.5px solid rgba(255, 169, 64, .45);
      border-radius: 6px;
    }
    /* Corner brackets */
    .vf-corner {
      position: absolute; width: 22px; height: 22px;
      border-color: #FFA940; border-style: solid;
    }
    .tl { top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius: 5px 0 0 0; }
    .tr { top:-2px; right:-2px; border-width:3px 3px 0 0; border-radius: 0 5px 0 0; }
    .bl { bottom:-2px; left:-2px; border-width:0 0 3px 3px; border-radius: 0 0 0 5px; }
    .br { bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-radius: 0 0 5px 0; }

    /* Scan line */
    .scan-line {
      position: absolute; inset-x: 6px;
      height: 2px;
      background: linear-gradient(to right, transparent, #FFA940 40%, #FFA940 60%, transparent);
      box-shadow: 0 0 10px 2px rgba(255,169,64,.6);
      animation: sweep 2.2s ease-in-out infinite;
    }
    @keyframes sweep { 0%,100%{ top: 8%; } 50%{ top: 88%; } }

    .scan-label {
      color: #fff;
      font-size: 16px; font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
      letter-spacing: .02em;
      margin-bottom: 8px;
    }
    .scan-sub {
      color: rgba(255,255,255,.52);
      font-size: 12px; text-align: center;
    }

    /* ── Status pill ───────────────────────────────────────────────────── */
    #status-pill {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      z-index: 50;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      display: flex; align-items: center; gap: 8px;
      color: #fff; font-size: 12px; font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      transition: all .3s;
    }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.3);
      transition: background .3s, box-shadow .3s;
      flex-shrink: 0;
    }
    #status-dot.found   { background: #00e676; box-shadow: 0 0 7px #00e676; }
    #status-dot.lost    { background: #ff5252; }
    #status-dot.loading { background: #FFA940; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

    /* ── Bottom action bar (always visible for user convenience) ─────────── */
    #action-bar {
      position: fixed;
      bottom: 0; inset-x: 0;
      z-index: 50;
      padding: 16px 24px;
      padding-bottom: max(24px, calc(16px + env(safe-area-inset-bottom)));
      background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.4) 70%, transparent 100%);
      display: flex; justify-content: center;
      opacity: 1; transform: translateY(0);
      pointer-events: auto;
      transition: opacity .3s, transform .3s;
    }

    #btn-download {
      width: 100%; max-width: 360px;
      padding: 17px 24px;
      border: none; border-radius: 18px;
      background: linear-gradient(135deg, #FF5C00 0%, #FFA940 100%);
      color: #fff; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(255,92,0,.45);
      transition: transform .15s, box-shadow .15s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-download:active { transform: scale(.97); box-shadow: 0 4px 16px rgba(255,92,0,.3); }
    #btn-download svg { flex-shrink: 0; }

    /* ── Back button ───────────────────────────────────────────────────── */
    #btn-back {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 50;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.85);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Loading spinner (while MindAR initialises) ─────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      background: #0d0205;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity .5s;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .spinner {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(255,169,64,.2);
      border-top-color: #FFA940;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { color: rgba(255,255,255,.7); font-size: 14px; }

    /* Hide MindAR's built-in UI */
    .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p class="load-text">جاري تشغيل الكاميرا...</p>
  </div>

  <!-- MindAR root (camera + WebGL canvas injected here) -->
  <div id="ar-root"></div>

  <!-- Scan guide (shown while target not found) -->
  <div id="scan-overlay">
    <div class="viewfinder">
      <div class="vf-border"></div>
      <div class="vf-corner tl"></div>
      <div class="vf-corner tr"></div>
      <div class="vf-corner bl"></div>
      <div class="vf-corner br"></div>
      <div class="scan-line"></div>
    </div>
    <p class="scan-label">وجّه الكاميرا على الكارت المطبوع</p>
    <p class="scan-sub">اجعل الكارت داخل الإطار تماماً</p>
  </div>

  <!-- Status pill -->
  <div id="status-pill">
    <div id="status-dot" class="loading"></div>
    <span id="status-text">جاري البحث عن الكارت...</span>
  </div>

  <!-- Back -->
  <a id="btn-back" href="/">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6"/>
    </svg>
    رجوع
  </a>

  <!-- Bottom bar (download, shown when target is tracked) -->
  <div id="action-bar">
    <button id="btn-download" onclick="downloadPhoto()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      حفظ الصورة بجهازك
    </button>
  </div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// URL params
// ─────────────────────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const imgUrl  = params.get('img')   ? decodeURIComponent(params.get('img'))  : null;
const origUrl = params.get('orig')  ? decodeURIComponent(params.get('orig')) : null;

// ─────────────────────────────────────────────────────────────────────────────
// Physical card: 152 × 102 mm Landscape (2471 × 1658 px target)
// In MindAR anchor space: target width = 1.0 unit, height = 1658 / 2471 ≈ 0.671
// Origin (0, 0) is the exact center of the card.
// ─────────────────────────────────────────────────────────────────────────────
const CARD_W = 1.0;
const CARD_H = 1658 / 2471;                      // ≈ 0.67098

// Left Slot (Original Photo): x=254, y=275, w=910, h=823
const ORIG_SLOT_W = 910 / 2471;                  // ≈ 0.3683
const ORIG_SLOT_H = 823 / 2471;                  // ≈ 0.3331
const ORIG_SLOT_X = (254 + 910/2 - 2471/2) / 2471; // -0.2131
const ORIG_SLOT_Y = (1658/2 - (275 + 823/2)) / 2471; // +0.0577

// Right Slot (AI Memory Photo): x=1307, y=275, w=910, h=823
const AI_SLOT_W   = 910 / 2471;                  // ≈ 0.3683
const AI_SLOT_H   = 823 / 2471;                  // ≈ 0.3331
const AI_SLOT_X   = (1307 + 910/2 - 2471/2) / 2471; // +0.2131
const AI_SLOT_Y   = (1658/2 - (275 + 823/2)) / 2471; // +0.0577

// Talabat Mart Logo: x=879, y=83, w=713, h=153
const LOGO_W      = 713 / 2471;                  // ≈ 0.2885
const LOGO_H      = 153 / 2471;                  // ≈ 0.0619
const LOGO_X      = (879 + 713/2 - 2471/2) / 2471; // ≈ 0.0
const LOGO_Y      = (1658/2 - (83 + 153/2)) / 2471; // ≈ +0.2709

// Enjoy Your Memory Banner: x=781, y=1315, w=919, h=236
const BANNER_W    = 919 / 2471;                  // ≈ 0.3719
const BANNER_H    = 236 / 2471;                  // ≈ 0.0955
const BANNER_X    = (781 + 919/2 - 2471/2) / 2471; // ≈ 0.0
const BANNER_Y    = (1658/2 - (1315 + 236/2)) / 2471; // ≈ -0.2444

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setStatus(label, dotClass) {
  $('status-text').textContent = label;
  $('status-dot').className = dotClass;
}

function loadHTMLImage(url) {
  return new Promise(resolve => {
    const tryLoad = (crossOrigin) => {
      const img = new Image();
      if (crossOrigin) img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => {
        if (crossOrigin) tryLoad(false);
        else resolve(null);
      };
      img.src = url;
    };
    tryLoad(true);
  });
}

function createTextureFromCanvas(canvas) {
  const THREE = window.MINDAR.IMAGE.THREE;
  const t = new THREE.CanvasTexture(canvas);
  if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

function drawCoverToCanvas(img, sx, sy, sw, sh, targetW, targetH) {
  const c = document.createElement('canvas');
  c.width = targetW;
  c.height = targetH;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
  return c;
}

function makeFallbackTexture(text) {
  const c = document.createElement('canvas');
  c.width = 910; c.height = 823;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2b060d';
  ctx.fillRect(0, 0, 910, 823);
  ctx.fillStyle = '#FFA940';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 455, 411);
  return createTextureFromCanvas(c);
}

// Loads both original and AI textures with automatic smart slicing
async function loadPhotoTextures(imgUrl, origUrl) {
  let aiTex   = null;
  let origTex = null;

  const mainImg = imgUrl ? await loadHTMLImage(imgUrl) : null;
  
  if (mainImg) {
    const aspect = mainImg.naturalWidth / mainImg.naturalHeight;
    // If the image is the full framed card (aspect > 1.35), slice both photos
    if (aspect > 1.35) {
      const w = mainImg.naturalWidth;
      const h = mainImg.naturalHeight;
      const origC = drawCoverToCanvas(
        mainImg,
        (254 / 2471) * w, (275 / 1658) * h,
        (910 / 2471) * w, (823 / 1658) * h,
        910, 823
      );
      origTex = createTextureFromCanvas(origC);

      const aiC = drawCoverToCanvas(
        mainImg,
        (1307 / 2471) * w, (275 / 1658) * h,
        (910 / 2471) * w, (823 / 1658) * h,
        910, 823
      );
      aiTex = createTextureFromCanvas(aiC);
    } else {
      const aiC = drawCoverToCanvas(mainImg, 0, 0, mainImg.naturalWidth, mainImg.naturalHeight, 910, 823);
      aiTex = createTextureFromCanvas(aiC);
    }
  }

  if (!origTex) {
    const origSource = origUrl || '/sample-original.png';
    const origImg = await loadHTMLImage(origSource);
    if (origImg) {
      const c = drawCoverToCanvas(origImg, 0, 0, origImg.naturalWidth, origImg.naturalHeight, 910, 823);
      origTex = createTextureFromCanvas(c);
    } else {
      origTex = makeFallbackTexture('Original Photo');
    }
  }

  if (!aiTex) {
    const sampleAiImg = await loadHTMLImage('/sample-ai.png');
    if (sampleAiImg) {
      const c = drawCoverToCanvas(sampleAiImg, 0, 0, sampleAiImg.naturalWidth, sampleAiImg.naturalHeight, 910, 823);
      aiTex = createTextureFromCanvas(c);
    } else {
      aiTex = makeFallbackTexture('AI Memory Photo');
    }
  }

  return { aiTex, origTex };
}

async function loadLogoTexture() {
  const img = await loadHTMLImage('/talabat-logo.png');
  if (!img) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 713;
  c.height = img.naturalHeight || 153;
  c.getContext('2d').drawImage(img, 0, 0);
  return createTextureFromCanvas(c);
}

async function loadBannerTexture() {
  const img = await loadHTMLImage('/enjoy-memory.png');
  if (!img) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 919;
  c.height = img.naturalHeight || 236;
  c.getContext('2d').drawImage(img, 0, 0);
  return createTextureFromCanvas(c);
}

async function loadFrameTexture() {
  let img = await loadHTMLImage('/print-frame-clean.png');
  if (!img) img = await loadHTMLImage('/print-frame-landscape.png');
  if (!img) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 2471;
  c.height = img.naturalHeight || 1658;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  // Double-safeguard: mask out logo & ribbon if fallback image was used
  ctx.fillStyle = '#FF5900';
  ctx.fillRect(860, 75, 750, 170); // Cleans logo area in orange header
  ctx.fillStyle = '#F7EEE3';
  ctx.fillRect(760, 1305, 955, 255); // Cleans ribbon area in beige background
  return createTextureFromCanvas(c);
}

function createShadowTexture() {
  const THREE = window.MINDAR.IMAGE.THREE;
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 40, 128, 128, 120);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
  grad.addColorStop(0.55, 'rgba(0, 0, 0, 0.18)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function createPhotoSlab(THREE, tex, w, h, thickness) {
  const photoGeo = new THREE.BoxGeometry(w, h, thickness);
  const photoMat = new THREE.MeshBasicMaterial({ map: tex });
  const edgeMat  = new THREE.MeshBasicMaterial({ color: 0xfcfcfc }); // clean photo paper core
  const backMat  = new THREE.MeshBasicMaterial({ color: 0xf0f0f0 });

  const materials = [
    edgeMat,  // right (+X)
    edgeMat,  // left (-X)
    edgeMat,  // top (+Y)
    edgeMat,  // bottom (-Y)
    photoMat, // front (+Z) — 100% natural photo pixels
    backMat,  // back (-Z)
  ];
  return new THREE.Mesh(photoGeo, materials);
}

// ─────────────────────────────────────────────────────────────────────────────
// Build 3D Scene: Clean, Natural Pop-Out for Photos & Talabat Branding
// ─────────────────────────────────────────────────────────────────────────────
let aiPhotoMesh    = null;
let aiShadowMesh   = null;
let origPhotoMesh  = null;
let origShadowMesh = null;
let logoMesh       = null;
let logoShadowMesh = null;
let bannerMesh     = null;
let bannerShadowMesh = null;

async function buildAnchorContent(anchor, scene) {
  const THREE = window.MINDAR.IMAGE.THREE;
  const group = anchor.group;

  const [photos, logoTex, bannerTex, frameTex] = await Promise.all([
    loadPhotoTextures(imgUrl, origUrl),
    loadLogoTexture(),
    loadBannerTexture(),
    loadFrameTexture(),
  ]);

  // 0. Base Frame Card Plate (Clean printed landscape frame at Z=0.001)
  // Provides clean background so the 3D photos, logo, and ribbon float without duplicates underneath!
  if (frameTex) {
    const frameGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
    const frameMat = new THREE.MeshBasicMaterial({
      map: frameTex,
      transparent: false,
      depthWrite: true,
    });
    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
    frameMesh.position.set(0, 0, 0.001);
    frameMesh.renderOrder = 0;
    group.add(frameMesh);
  }

  const sharedShadowTex = createShadowTexture();

  // 1. Right Slot (AI Memory Photo - Hero Pop-Out at Z=0.052)
  aiShadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(AI_SLOT_W * 1.18, AI_SLOT_H * 1.18),
    new THREE.MeshBasicMaterial({ map: sharedShadowTex, transparent: true, depthWrite: false, opacity: 0.90 })
  );
  aiShadowMesh.position.set(AI_SLOT_X + 0.005, AI_SLOT_Y - 0.007, 0.008);
  aiShadowMesh.renderOrder = 1;
  group.add(aiShadowMesh);

  aiPhotoMesh = createPhotoSlab(THREE, photos.aiTex, AI_SLOT_W, AI_SLOT_H, 0.012);
  aiPhotoMesh.position.set(AI_SLOT_X, AI_SLOT_Y, 0.052);
  aiPhotoMesh.renderOrder = 3;
  group.add(aiPhotoMesh);

  // 2. Left Slot (Original Photo - Elevated Pop-Out at Z=0.038)
  origShadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(ORIG_SLOT_W * 1.18, ORIG_SLOT_H * 1.18),
    new THREE.MeshBasicMaterial({ map: sharedShadowTex, transparent: true, depthWrite: false, opacity: 0.85 })
  );
  origShadowMesh.position.set(ORIG_SLOT_X + 0.004, ORIG_SLOT_Y - 0.006, 0.008);
  origShadowMesh.renderOrder = 1;
  group.add(origShadowMesh);

  origPhotoMesh = createPhotoSlab(THREE, photos.origTex, ORIG_SLOT_W, ORIG_SLOT_H, 0.012);
  origPhotoMesh.position.set(ORIG_SLOT_X, ORIG_SLOT_Y, 0.038);
  origPhotoMesh.renderOrder = 3;
  group.add(origPhotoMesh);

  // 3. Talabat Mart Logo (Top Center Elevated Badge at Z=0.032)
  if (logoTex) {
    logoShadowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(LOGO_W * 1.12, LOGO_H * 1.35),
      new THREE.MeshBasicMaterial({ map: sharedShadowTex, transparent: true, depthWrite: false, opacity: 0.85 })
    );
    logoShadowMesh.position.set(LOGO_X + 0.003, LOGO_Y - 0.005, 0.007);
    logoShadowMesh.renderOrder = 1;
    group.add(logoShadowMesh);

    logoMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(LOGO_W, LOGO_H),
      new THREE.MeshBasicMaterial({ map: logoTex, transparent: true, depthWrite: true, alphaTest: 0.05 })
    );
    logoMesh.position.set(LOGO_X, LOGO_Y, 0.032);
    logoMesh.renderOrder = 2;
    group.add(logoMesh);
  }

  // 4. "ENJOY YOUR MEMORY!" Banner (Bottom Center Elevated Badge at Z=0.024)
  if (bannerTex) {
    bannerShadowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(BANNER_W * 1.10, BANNER_H * 1.25),
      new THREE.MeshBasicMaterial({ map: sharedShadowTex, transparent: true, depthWrite: false, opacity: 0.80 })
    );
    bannerShadowMesh.position.set(BANNER_X + 0.003, BANNER_Y - 0.005, 0.007);
    bannerShadowMesh.renderOrder = 1;
    group.add(bannerShadowMesh);

    bannerMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(BANNER_W, BANNER_H),
      new THREE.MeshBasicMaterial({ map: bannerTex, transparent: true, depthWrite: true, alphaTest: 0.05 })
    );
    bannerMesh.position.set(BANNER_X, BANNER_Y, 0.024);
    bannerMesh.renderOrder = 2;
    group.add(bannerMesh);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Natural, Harmonic 3D Floating Animation (Parallax Depth Feel)
// ─────────────────────────────────────────────────────────────────────────────
let elapsed = 0;
function tick(delta) {
  elapsed += delta;

  // 1. Right Photo (AI) - Primary hero floating
  if (aiPhotoMesh) {
    const floatZ = Math.sin(elapsed * 1.5) * 0.0035;
    aiPhotoMesh.position.z = 0.052 + floatZ;
    if (aiShadowMesh) {
      aiShadowMesh.material.opacity = 0.90 - floatZ * 15.0;
    }
  }

  // 2. Left Photo (Original) - Harmonious secondary floating
  if (origPhotoMesh) {
    const floatZ = Math.sin(elapsed * 1.5 + 0.8) * 0.0030;
    origPhotoMesh.position.z = 0.038 + floatZ;
    if (origShadowMesh) {
      origShadowMesh.material.opacity = 0.85 - floatZ * 15.0;
    }
  }

  // 3. Talabat Logo - Subtle elevated hovering
  if (logoMesh) {
    const floatZ = Math.sin(elapsed * 1.8 + 1.5) * 0.0018;
    logoMesh.position.z = 0.032 + floatZ;
    if (logoShadowMesh) {
      logoShadowMesh.material.opacity = 0.85 - floatZ * 20.0;
    }
  }

  // 4. Bottom Banner - Gentle foundation floating
  if (bannerMesh) {
    const floatZ = Math.sin(elapsed * 1.3 + 2.5) * 0.0015;
    bannerMesh.position.z = 0.024 + floatZ;
    if (bannerShadowMesh) {
      bannerShadowMesh.material.opacity = 0.80 - floatZ * 20.0;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Download (always available with instant visual feedback & blob download)
// ─────────────────────────────────────────────────────────────────────────────
async function downloadPhoto() {
  if (!imgUrl) {
    alert('لا توجد صورة للحفظ');
    return;
  }
  const btn = $('btn-download');
  const originalHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.style.opacity = '0.75';
    btn.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spinner" style="border:none;animation:spin 0.8s linear infinite;">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25" stroke-width="3"></circle>
        <path d="M12 2a10 10 0 0 1 10 10" stroke-width="3"></path>
      </svg>
      جاري التحميل...
    `;
  }

  try {
    if (imgUrl.startsWith('data:')) {
      const a = document.createElement('a');
      a.href = imgUrl;
      a.download = `talabat-memory-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      try {
        const res = await fetch(imgUrl);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `talabat-memory-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch {
        window.open(imgUrl, '_blank');
      }
    }
  } finally {
    setTimeout(() => {
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = `
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          تم الحفظ بجهازك ✓
        `;
        setTimeout(() => {
          if (btn) btn.innerHTML = originalHtml;
        }, 2500);
      }
    }, 600);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Main: initialise MindAR
// ─────────────────────────────────────────────────────────────────────────────
async function startAR() {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container:      $('ar-root'),
    imageTargetSrc: '/targets.mind',  // compiled from print-frame-landscape.png
    maxTrack:       1,
    filterMinCF:    0.001,   // reduce jitter (lower = smoother but more lag)
    filterBeta:     1000,    // one-euro filter param for tracking smoothness
    missTolerance:  5,       // frames to wait before declaring target lost
    warmupTolerance: 3,      // frames before declaring target found
    uiLoading:      'no',
    uiScanning:     'no',
    uiError:        'no',
  });

  const { renderer, scene, camera } = mindarThree;
  if (renderer && renderer.setClearColor) {
    renderer.setClearColor(0x000000, 0);
  }

  // Anchor 0 = first (and only) target image
  const anchor = mindarThree.addAnchor(0);

  // ── Target detected ───────────────────────────────────────────────────────
  anchor.onTargetFound = () => {
    $('scan-overlay').classList.add('hidden');
    setStatus('الكارت مكتشف ✓', 'found');
  };

  // ── Target lost ───────────────────────────────────────────────────────────
  anchor.onTargetLost = () => {
    $('scan-overlay').classList.remove('hidden');
    setStatus('جاري البحث عن الكارت...', 'lost');
  };

  // Build 3D content
  await buildAnchorContent(anchor, scene);

  // Start camera & tracking
  setStatus('جاري تشغيل الكاميرا...', 'loading');
  await mindarThree.start();

  if (mindarThree.video) {
    mindarThree.video.style.zIndex = '0';
  }
  if (renderer.domElement) {
    renderer.domElement.style.zIndex = '1';
  }

  // Hide loading screen
  const ls = $('loading-screen');
  ls.classList.add('fade-out');
  setTimeout(() => ls.remove(), 600);

  setStatus('جاري البحث عن الكارت...', 'lost');

  // Animation loop with delta time
  let lastTime = performance.now();
  renderer.setAnimationLoop(() => {
    const now   = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime    = now;
    tick(delta);
    renderer.render(scene, camera);
  });
}
