<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AI Memory — AR Experience</title>

  <!--
    MindAR.js + Three.js bundle (image tracking, zero-install WebAR)
    Physical target: 102 × 152 mm printed photo card
    Anchor system   : target width = 1 unit  →  height = 152/102 ≈ 1.49 units
  -->
  <!-- MindAR self-hosted bundle (with CDN fallback) -->
  <script src="/mindar-image-three.prod.js"></script>
  <script>
    if (!window.MINDAR || !window.MINDAR.IMAGE) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"><\/script>');
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* MindAR injects its video + canvas here */
    #ar-root { width: 100vw; height: 100vh; position: relative; }

    /* ── Scan-guide overlay (visible until target found) ───────────────── */
    #scan-overlay {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(to bottom, rgba(0,0,0,.35) 0%, transparent 40%, transparent 60%, rgba(0,0,0,.55) 100%);
      pointer-events: none;
      transition: opacity .4s;
    }
    #scan-overlay.hidden { opacity: 0; }

    /* Viewfinder — matches 152:102 landscape card aspect */
    .viewfinder {
      width: min(85vw, 320px);
      aspect-ratio: 152 / 102;
      position: relative;
      margin-bottom: 24px;
    }
    .vf-border {
      position: absolute; inset: 0;
      border: 1.5px solid rgba(255, 169, 64, .45);
      border-radius: 6px;
    }
    /* Corner brackets */
    .vf-corner {
      position: absolute; width: 22px; height: 22px;
      border-color: #FFA940; border-style: solid;
    }
    .tl { top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius: 5px 0 0 0; }
    .tr { top:-2px; right:-2px; border-width:3px 3px 0 0; border-radius: 0 5px 0 0; }
    .bl { bottom:-2px; left:-2px; border-width:0 0 3px 3px; border-radius: 0 0 0 5px; }
    .br { bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-radius: 0 0 5px 0; }

    /* Scan line */
    .scan-line {
      position: absolute; inset-x: 6px;
      height: 2px;
      background: linear-gradient(to right, transparent, #FFA940 40%, #FFA940 60%, transparent);
      box-shadow: 0 0 10px 2px rgba(255,169,64,.6);
      animation: sweep 2.2s ease-in-out infinite;
    }
    @keyframes sweep { 0%,100%{ top: 8%; } 50%{ top: 88%; } }

    .scan-label {
      color: #fff;
      font-size: 16px; font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
      letter-spacing: .02em;
      margin-bottom: 8px;
    }
    .scan-sub {
      color: rgba(255,255,255,.52);
      font-size: 12px; text-align: center;
    }

    /* ── Status pill ───────────────────────────────────────────────────── */
    #status-pill {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      z-index: 50;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      display: flex; align-items: center; gap: 8px;
      color: #fff; font-size: 12px; font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      transition: all .3s;
    }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.3);
      transition: background .3s, box-shadow .3s;
      flex-shrink: 0;
    }
    #status-dot.found   { background: #00e676; box-shadow: 0 0 7px #00e676; }
    #status-dot.lost    { background: #ff5252; }
    #status-dot.loading { background: #FFA940; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

    /* ── Bottom action bar ─────────────────────────────────────────────── */
    #action-bar {
      position: fixed;
      bottom: 0; inset-x: 0;
      z-index: 50;
      padding: 16px 24px;
      padding-bottom: max(24px, calc(16px + env(safe-area-inset-bottom)));
      background: linear-gradient(to top, rgba(0,0,0,.92) 0%, transparent 100%);
      display: flex; justify-content: center;
      opacity: 0; transform: translateY(20px);
      transition: opacity .4s, transform .4s;
      pointer-events: none;
    }
    #action-bar.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    #btn-download {
      width: 100%; max-width: 360px;
      padding: 17px 24px;
      border: none; border-radius: 18px;
      background: linear-gradient(135deg, #FF5C00 0%, #FFA940 100%);
      color: #fff; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(255,92,0,.45);
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-download:active { transform: scale(.97); box-shadow: 0 4px 16px rgba(255,92,0,.3); }
    #btn-download svg { flex-shrink: 0; }

    /* ── Back button ───────────────────────────────────────────────────── */
    #btn-back {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 50;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.85);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Loading spinner (while MindAR initialises) ─────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      background: #0d0205;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity .5s;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .spinner {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(255,169,64,.2);
      border-top-color: #FFA940;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { color: rgba(255,255,255,.7); font-size: 14px; }

    /* Hide MindAR's built-in UI */
    .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p class="load-text">جاري تشغيل الكاميرا...</p>
  </div>

  <!-- MindAR root (camera + WebGL canvas injected here) -->
  <div id="ar-root"></div>

  <!-- Scan guide (shown while target not found) -->
  <div id="scan-overlay">
    <div class="viewfinder">
      <div class="vf-border"></div>
      <div class="vf-corner tl"></div>
      <div class="vf-corner tr"></div>
      <div class="vf-corner bl"></div>
      <div class="vf-corner br"></div>
      <div class="scan-line"></div>
    </div>
    <p class="scan-label">وجّه الكاميرا على الكارت المطبوع</p>
    <p class="scan-sub">اجعل الكارت داخل الإطار تماماً</p>
  </div>

  <!-- Status pill -->
  <div id="status-pill">
    <div id="status-dot" class="loading"></div>
    <span id="status-text">جاري البحث عن الكارت...</span>
  </div>

  <!-- Back -->
  <a id="btn-back" href="/">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6"/>
    </svg>
    رجوع
  </a>

  <!-- Bottom bar (download, shown when target is tracked) -->
  <div id="action-bar">
    <button id="btn-download" onclick="downloadPhoto()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      حفظ الصورة بجهازك
    </button>
  </div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// URL params
// ─────────────────────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const imgUrl  = params.get('img')   ? decodeURIComponent(params.get('img'))  : null;
const origUrl = params.get('orig')  ? decodeURIComponent(params.get('orig')) : null;

// ─────────────────────────────────────────────────────────────────────────────
// Physical card: 152 × 102 mm Landscape (2471 × 1658 px target)
// In MindAR anchor space: target width = 1.0 unit, height = 1658 / 2471 ≈ 0.671
// Slot for AI Photo on the card: x=1307, y=275, w=910, h=823
// ─────────────────────────────────────────────────────────────────────────────
const CARD_W = 1.0;
const CARD_H = 1658 / 2471;                // ≈ 0.67098
const SLOT_W = 910 / 2471;                 // ≈ 0.3683
const SLOT_H = 823 / 2471;                 // ≈ 0.3331
const SLOT_X = (1307 + 910/2 - 2471/2) / 2471; // +0.2131
const SLOT_Y = (1658/2 - (275 + 823/2)) / 2471; // +0.0577

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setStatus(label, dotClass) {
  $('status-text').textContent = label;
  $('status-dot').className = dotClass;
}

// Load image into a CanvasTexture with natural true-to-life colors
function loadTexture(url) {
  const THREE = window.MINDAR.IMAGE.THREE;
  return new Promise(resolve => {
    const tryLoad = (crossOrigin) => {
      const img = new Image();
      if (crossOrigin) img.crossOrigin = 'anonymous';
      img.onload = () => {
        const c   = document.createElement('canvas');
        c.width   = img.naturalWidth  || 910;
        c.height  = img.naturalHeight || 823;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const t   = new THREE.CanvasTexture(c);
        if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
        if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        resolve(t);
      };
      img.onerror = () => {
        if (crossOrigin) tryLoad(false);
        else resolve(makeFallbackTexture());
      };
      img.src = url;
    };
    tryLoad(true);
  });
}

function makeFallbackTexture() {
  const THREE = window.MINDAR.IMAGE.THREE;
  const c = document.createElement('canvas');
  c.width = 910; c.height = 823;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2b060d';
  ctx.fillRect(0, 0, 910, 823);
  ctx.fillStyle = '#FFA940';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('AI Memory Photo', 455, 411);
  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ─────────────────────────────────────────────────────────────────────────────
// Build 3D Scene: Clean, Natural Photo with 3D Depth & Pop-Out
// NO artificial boxes, NO gold rails, NO orange neon glow, NO fake sparkles
// ─────────────────────────────────────────────────────────────────────────────
let photoPlateMesh = null;
let shadowMesh     = null;

async function buildAnchorContent(anchor, scene) {
  const THREE = window.MINDAR.IMAGE.THREE;
  const group = anchor.group;

  const tex = imgUrl
    ? await loadTexture(imgUrl)
    : makeFallbackTexture();

  // 1. Soft, realistic contact shadow on the paper card surface
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 256; shadowCanvas.height = 256;
  const sCtx = shadowCanvas.getContext('2d');
  const grad = sCtx.createRadialGradient(128, 128, 40, 128, 128, 120);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0.40)');
  grad.addColorStop(0.6, 'rgba(0, 0, 0, 0.15)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  sCtx.fillStyle = grad;
  sCtx.fillRect(0, 0, 256, 256);
  const shadowTex = new THREE.CanvasTexture(shadowCanvas);

  shadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(SLOT_W * 1.18, SLOT_H * 1.18),
    new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      depthWrite: false,
    })
  );
  shadowMesh.position.set(SLOT_X + 0.004, SLOT_Y - 0.006, 0.008);
  group.add(shadowMesh);

  // 2. 3D Floating Photo Card (Physical Depth with Clean White Photo-Paper Edge)
  // MeshBasicMaterial guarantees 100% natural, unchanged photo pixels — zero light distortion!
  const photoGeo  = new THREE.BoxGeometry(SLOT_W, SLOT_H, 0.012);
  const photoMat  = new THREE.MeshBasicMaterial({ map: tex });
  const edgeMat   = new THREE.MeshBasicMaterial({ color: 0xf8f8f8 }); // clean photo paper core

  const materials = [
    edgeMat,   // right (+X)
    edgeMat,   // left (-X)
    edgeMat,   // top (+Y)
    edgeMat,   // bottom (-Y)
    photoMat,  // front (+Z) — 100% original natural photo
    edgeMat,   // back (-Z)
  ];

  photoPlateMesh = new THREE.Mesh(photoGeo, materials);
  photoPlateMesh.position.set(SLOT_X, SLOT_Y, 0.045);
  group.add(photoPlateMesh);
}

// ─────────────────────────────────────────────────────────────────────────────
// Natural, gentle 3D floating animation (Parallax depth feel)
// ─────────────────────────────────────────────────────────────────────────────
let elapsed = 0;
function tick(delta) {
  elapsed += delta;
  if (photoPlateMesh) {
    // Subtle, natural breathing elevation in Z (true 3D pop-out)
    photoPlateMesh.position.z = 0.045 + Math.sin(elapsed * 1.6) * 0.004;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Download
// ─────────────────────────────────────────────────────────────────────────────
function downloadPhoto() {
  if (!imgUrl) { alert('لا توجد صورة للحفظ'); return; }
  const a  = document.createElement('a');
  a.href   = imgUrl;
  a.target = '_blank';
  a.download = `ai-memory-${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ─────────────────────────────────────────────────────────────────────────────
// Main: initialise MindAR
// ─────────────────────────────────────────────────────────────────────────────
async function startAR() {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container:      $('ar-root'),
    imageTargetSrc: '/targets.mind',  // compiled from print-frame-landscape.png
    maxTrack:       1,
    filterMinCF:    0.001,   // reduce jitter (lower = smoother but more lag)
    filterBeta:     1000,    // one-euro filter param for tracking smoothness
    missTolerance:  5,       // frames to wait before declaring target lost
    warmupTolerance: 3,      // frames before declaring target found
    uiLoading:      'no',
    uiScanning:     'no',
    uiError:        'no',
  });

  const { renderer, scene, camera } = mindarThree;

  // Anchor 0 = first (and only) target image
  const anchor = mindarThree.addAnchor(0);

  // ── Target detected ───────────────────────────────────────────────────────
  anchor.onTargetFound = () => {
    $('scan-overlay').classList.add('hidden');
    $('action-bar').classList.add('visible');
    setStatus('الكارت مكتشف ✓', 'found');
  };

  // ── Target lost ───────────────────────────────────────────────────────────
  anchor.onTargetLost = () => {
    $('scan-overlay').classList.remove('hidden');
    $('action-bar').classList.remove('visible');
    setStatus('جاري البحث عن الكارت...', 'lost');
  };

  // Build 3D content
  await buildAnchorContent(anchor, scene);

  // Start camera & tracking
  setStatus('جاري تشغيل الكاميرا...', 'loading');
  await mindarThree.start();

  // Hide loading screen
  const ls = $('loading-screen');
  ls.classList.add('fade-out');
  setTimeout(() => ls.remove(), 600);

  setStatus('جاري البحث عن الكارت...', 'lost');

  // Animation loop with delta time
  let lastTime = performance.now();
  renderer.setAnimationLoop(() => {
    const now   = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime    = now;
    tick(delta);
    renderer.render(scene, camera);
  });
}

// ── Launch — blocking scripts in head guarantee window.MINDAR is ready ───────
if (!window.MINDAR || !window.MINDAR.IMAGE) {
  const ls = $('loading-screen');
  ls.innerHTML = `
    <p style="color:#ff5252;font-size:15px;text-align:center;padding:24px;">
      تعذّر تحميل مكتبة AR.<br>
      <span style="color:rgba(255,255,255,.5);font-size:12px;">
        تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.
      </span>
    </p>
    <button onclick="location.reload()" style="margin-top:12px;padding:10px 24px;border-radius:12px;background:#FFA940;border:none;color:#000;font-weight:700;font-size:14px;cursor:pointer;">
      إعادة التحميل
    </button>
    <a href="/" style="display:block;margin-top:16px;color:#FFA940;font-size:14px;text-decoration:none;">← رجوع</a>
  `;
} else {
  startAR().catch(err => {
    console.error('[AR] start failed:', err);
    setStatus('خطأ في تشغيل الكاميرا', 'lost');
    const ls = $('loading-screen');
    ls.innerHTML = `
      <p style="color:#ff5252;font-size:15px;text-align:center;padding:24px;">
        تعذّر تشغيل الكاميرا.<br>
        <span style="color:rgba(255,255,255,.5);font-size:12px;">
          ${err?.message || 'تأكد من السماح بالوصول للكاميرا'}
        </span>
      </p>
      <a href="/" style="display:block;margin-top:16px;color:#FFA940;font-size:14px;text-decoration:none;">← رجوع</a>
    `;
  });
}
</script>
</body>
</html>
